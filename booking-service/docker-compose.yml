services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  booking-service:
    build:
      context: ..
      dockerfile: booking-service/Dockerfile
    ports:
      - "9091:9091"
      - "8081:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: booking_db
      DB_SSLMODE: disable
      HTTP_PORT: 8080
      GRPC_PORT: 9091
      EVENT_SERVICE_ADDR: event-service:9091
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - microservices-network  

networks:
  microservices-network:
    external: true 

volumes:
  postgres_data:        
